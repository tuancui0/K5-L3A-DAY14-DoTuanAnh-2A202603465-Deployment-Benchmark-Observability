# Render Blueprint: web service build từ Dockerfile + Redis (Key Value).
services:
  - type: web
    name: ai-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-agent-redis
          property: connectionString

  - type: keyvalue
    name: ai-agent-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
