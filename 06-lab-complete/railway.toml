# Railway: build bằng Dockerfile, health check ở /health.
# App lắng nghe theo biến PORT do Railway cấp (xử lý trong CMD của Dockerfile).
# AGENT_API_KEY, REDIS_URL đặt bằng `railway variables set` hoặc trên dashboard, không ghi vào file.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
